name: CI

on:
  push:
    branches:
      - main
      - jobs-orientied
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      BTP_CONFIG_PATH: src/config.example.ini
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run Python format and lint checks
        run: |
          python -m ruff check --select I,F app tests BackToPure.py

      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
